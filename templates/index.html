<!DOCTYPE html>
<html>

<head>

    <title>
        Customer Churn Prediction
    </title>

    <link rel="stylesheet" href="/static/style.css">

</head>


<body>


<div class="container">


<h1>
    Customer Churn Prediction
</h1>


<form action="/predict" method="post">


<label>
Senior Citizen
</label>

<select name="senior_citizen">

<option value="0">No</option>
<option value="1">Yes</option>

</select>



<label>
Partner
</label>

<select name="partner">

<option value="Yes">Yes</option>
<option value="No">No</option>

</select>



<label>
Dependents
</label>

<select name="dependents">

<option value="Yes">Yes</option>
<option value="No">No</option>

</select>



<label>
Tenure Months
</label>

<input 
type="number"
name="tenure_months"
required>



<label>
Phone Service
</label>

<select name="phone_service">

<option value="Yes">Yes</option>
<option value="No">No</option>

</select>



<label>
Paperless Billing
</label>

<select name="paperless_billing">

<option value="Yes">Yes</option>
<option value="No">No</option>

</select>



<label>
Monthly Charges
</label>

<input 
type="number"
step="0.01"
name="monthly_charges"
required>



<label>
Total Charges
</label>

<input 
type="number"
step="0.01"
name="total_charges"
required>



<label>
Multiple Lines
</label>

<select name="multiple_lines">

<option value="Yes">Yes</option>
<option value="No">No</option>

</select>



<label>
Internet Service
</label>

<select name="internet_service">

<option value="DSL">
DSL
</option>

<option value="Fiber optic">
Fiber optic
</option>

<option value="No">
No
</option>

</select>



<label>
Online Security
</label>

<select name="online_security">

<option value="Yes">Yes</option>
<option value="No">No</option>

</select>



<label>
Online Backup
</label>

<select name="online_backup">

<option value="Yes">Yes</option>
<option value="No">No</option>

</select>



<label>
Device Protection
</label>

<select name="device_protection">

<option value="Yes">Yes</option>
<option value="No">No</option>

</select>



<label>
Tech Support
</label>

<select name="tech_support">

<option value="Yes">Yes</option>
<option value="No">No</option>

</select>



<label>
Streaming TV
</label>

<select name="streaming_tv">

<option value="Yes">Yes</option>
<option value="No">No</option>

</select>



<label>
Streaming Movies
</label>

<select name="streaming_movies">

<option value="Yes">Yes</option>
<option value="No">No</option>

</select>



<label>
Contract
</label>

<select name="contract">


<option value="Month-to-month">
Month-to-month
</option>


<option value="One year">
One year
</option>


<option value="Two year">
Two year
</option>


</select>



<label>
Payment Method
</label>

<select name="payment_method">


<option value="Electronic check">
Electronic check
</option>


<option value="Mailed check">
Mailed check
</option>


<option value="Credit card (automatic)">
Credit card (automatic)
</option>


<option value="Bank transfer (automatic)">
Bank transfer (automatic)
</option>


</select>



<button type="submit">

Predict Churn

</button>


</form>



{% if prediction %}

<div class="result">

<h2>
Prediction Result:
</h2>

<p>
{{ prediction }}
</p>

</div>

{% endif %}



</div>


</body>

</html>
